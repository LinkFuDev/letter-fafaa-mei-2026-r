<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misi Rahasia 18 Mei</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>

  <style>
    :root {
      --bg-1: #DDF3FF;
      --bg-2: #CBEAFF;
      --bg-3: #EAF8FF;
      --bg-4: #F7FCFF;
      --gold: #D8B76A;
      --text: #26465C;
      --text-dark: #1F3A4A;
      --soft: #5F7F92;
      --cream: #FFF8E5;
      --sage: #BFE8D8;
      --glass: rgba(255,255,255,0.55);
      --border: rgba(216,183,106,0.35);
      --blue-shadow: rgba(120,190,230,0.25);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, var(--bg-1), var(--bg-3), var(--bg-4));
      overflow-x: hidden;
    }

    button {
      font: inherit;
      border: 0;
      cursor: pointer;
    }

    .font-classy {
      font-family: Georgia, "Times New Roman", serif;
      letter-spacing: -0.02em;
    }

    .app {
      position: relative;
      min-height: 100vh;
      padding: 18px 14px;
      overflow: hidden;
      background:
        radial-gradient(circle at top left, rgba(255,255,255,0.82), transparent 34%),
        radial-gradient(circle at 85% 22%, rgba(255,242,184,0.38), transparent 32%),
        linear-gradient(135deg, var(--bg-1), var(--bg-3) 48%, var(--bg-4));
    }

    .pattern {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.44;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.72) 0 2px, transparent 2px),
        radial-gradient(circle at 80% 30%, rgba(216,183,106,0.22) 0 1.5px, transparent 1.5px),
        linear-gradient(135deg, rgba(255,255,255,0.16) 25%, transparent 25%),
        linear-gradient(225deg, rgba(255,255,255,0.14) 25%, transparent 25%);
      background-size: 36px 36px, 44px 44px, 60px 60px, 60px 60px;
      mask-image: linear-gradient(to bottom, black, rgba(0,0,0,0.65), transparent);
    }

    .orb {
      position: fixed;
      border-radius: 999px;
      filter: blur(28px);
      opacity: 0.68;
      pointer-events: none;
    }

    .orb-1 {
      width: 230px;
      height: 230px;
      top: -80px;
      left: -90px;
      background: var(--bg-2);
    }

    .orb-2 {
      width: 220px;
      height: 220px;
      top: 18%;
      right: -95px;
      background: #FFF2B8;
    }

    .orb-3 {
      width: 250px;
      height: 250px;
      bottom: -105px;
      left: 18%;
      background: #DDF3FF;
    }

    .glitter {
      position: fixed;
      top: -12px;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: rgba(216,183,106,0.75);
      animation: glitterFall linear infinite;
      pointer-events: none;
      z-index: 1;
    }

    @keyframes glitterFall {
      0% {
        transform: translateY(-20px) translateX(0) scale(0.7);
        opacity: 0;
      }

      14% {
        opacity: 0.9;
      }

      100% {
        transform: translateY(112vh) translateX(30px) scale(1.25);
        opacity: 0;
      }
    }

    .shell {
      position: relative;
      z-index: 2;
      width: min(100%, 430px);
      min-height: calc(100vh - 36px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .slide-shell {
      justify-content: flex-start;
    }

    .glass {
      background: rgba(255,255,255,0.55);
      border: 1px solid var(--border);
      box-shadow: 0 26px 80px rgba(120,190,230,0.27);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .gate-card,
    .slide-card {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: 24px;
      animation: cardIn 0.55s ease both;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(22px) scale(0.975);
        filter: blur(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0);
      }
    }

    .slide-card {
      min-height: 490px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .slide-card::before {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      right: -55px;
      top: -55px;
      background: rgba(255,242,184,0.46);
      border-radius: 999px;
      filter: blur(22px);
    }

    .slide-card::after {
      content: "";
      position: absolute;
      width: 190px;
      height: 190px;
      left: -85px;
      bottom: -85px;
      background: rgba(203,234,255,0.62);
      border-radius: 999px;
      filter: blur(25px);
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .pill-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 18px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,0.52);
      border: 1px solid rgba(255,255,255,0.78);
      padding: 9px 12px;
      color: var(--soft);
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    .gold-pill {
      border-color: rgba(216,183,106,0.35);
      color: var(--text);
      font-weight: 650;
    }

    .icon-box {
      width: 82px;
      height: 82px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 28px;
      border: 1px solid rgba(216,183,106,0.3);
      background: rgba(247,252,255,0.72);
      box-shadow: 0 16px 45px rgba(120,190,230,0.24);
      animation: float 4.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    h1 {
      text-align: center;
      font-size: clamp(36px, 10vw, 46px);
      line-height: 1.02;
      color: var(--text);
    }

    h2 {
      font-size: clamp(30px, 8.3vw, 38px);
      line-height: 1.08;
      color: var(--text);
    }

    .lead {
      margin-top: 18px;
      text-align: center;
      color: #42697C;
      font-size: 15px;
      line-height: 1.75;
    }

    .text {
      color: #42697C;
      font-size: 15px;
      line-height: 1.78;
      white-space: pre-line;
    }

    .text + .text {
      margin-top: 16px;
    }

    .small-text {
      color: var(--soft);
      font-size: 12px;
      line-height: 1.7;
    }

    .answer-list,
    .stack {
      display: grid;
      gap: 12px;
    }

    .answer-list {
      margin-top: 22px;
    }

    .btn,
    .answer-btn,
    .nav-btn,
    .soft-btn {
      min-height: 46px;
      border-radius: 18px;
      padding: 13px 16px;
      color: var(--text);
      background: rgba(255,255,255,0.57);
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: 0 10px 28px rgba(120,190,230,0.17);
      font-weight: 750;
      transition: transform 0.16s ease, background 0.16s ease, opacity 0.16s ease;
    }

    .answer-btn {
      width: 100%;
      text-align: left;
      font-size: 14px;
    }

    .btn:active,
    .answer-btn:active,
    .nav-btn:active,
    .soft-btn:active {
      transform: scale(0.98);
    }

    .btn:disabled,
    .nav-btn:disabled {
      opacity: 0.46;
      cursor: not-allowed;
    }

    .gold-btn {
      background: rgba(216,183,106,0.22);
      border-color: rgba(216,183,106,0.35);
    }

    .message-box {
      margin-top: 18px;
      border-radius: 20px;
      border: 1px solid rgba(216,183,106,0.3);
      background: rgba(255,255,255,0.48);
      padding: 13px 15px;
      text-align: center;
      color: var(--soft);
      font-size: 14px;
      animation: popIn 0.32s ease both;
    }

    .message-box.correct {
      background: rgba(255,248,229,0.58);
      color: var(--text);
      font-weight: 700;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .header {
      position: sticky;
      top: 10px;
      z-index: 20;
      margin-bottom: 14px;
      display: grid;
      gap: 10px;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .timer-cell {
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.46);
      backdrop-filter: blur(12px);
      padding: 10px 9px;
      text-align: center;
      color: var(--soft);
      font-size: 11px;
      white-space: nowrap;
    }

    .audio-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border-radius: 999px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--text);
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(216,183,106,0.35);
      box-shadow: 0 10px 28px rgba(120,190,230,0.2);
      backdrop-filter: blur(12px);
      font-weight: 750;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      width: fit-content;
      margin-bottom: 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.5);
      padding: 9px 12px;
      color: var(--soft);
      font-size: 12px;
      line-height: 1;
    }

    .note-box {
      margin-top: 18px;
      border-radius: 22px;
      border: 1px solid rgba(216,183,106,0.28);
      background: rgba(255,255,255,0.45);
      padding: 16px;
      color: var(--soft);
      font-size: 14px;
      line-height: 1.7;
    }

    .warm-box {
      margin-top: 18px;
      border-radius: 26px;
      border: 1px solid rgba(216,183,106,0.3);
      background: linear-gradient(135deg, rgba(255,255,255,0.66), rgba(234,248,255,0.55), rgba(255,248,229,0.45));
      padding: 18px;
    }

    .stat-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .stat-card {
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.43);
      padding: 13px;
      box-shadow: 0 10px 30px rgba(120,190,230,0.14);
    }

    .stat-card span {
      display: block;
      color: var(--soft);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .stat-card strong {
      display: block;
      font-size: 13px;
      color: var(--text);
      line-height: 1.4;
    }

    .gift-btn {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      width: fit-content;
      border-radius: 20px;
      border: 1px solid rgba(216,183,106,0.35);
      background: rgba(255,255,255,0.55);
      padding: 13px 16px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 16px 40px rgba(120,190,230,0.2);
    }

    .modal-backdrop {
      position: fixed;
      z-index: 9000;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(221,243,255,0.6);
      backdrop-filter: blur(12px);
      animation: fadeIn 0.25s ease both;
    }

    .modal-card {
      width: min(100%, 360px);
      border-radius: 32px;
      border: 1px solid rgba(216,183,106,0.35);
      background: rgba(255,255,255,0.78);
      box-shadow: 0 28px 80px rgba(120,190,230,0.35);
      padding: 24px;
      text-align: center;
      animation: modalIn 0.32s ease both;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.94);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .check-list {
      display: grid;
      gap: 11px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.45);
      padding: 13px 14px;
      color: var(--text);
      text-align: left;
      box-shadow: 0 10px 28px rgba(120,190,230,0.14);
    }

    .check-box {
      width: 25px;
      height: 25px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 9px;
      border: 1px solid #CBEAFF;
      background: rgba(255,255,255,0.65);
      color: var(--text);
      font-weight: 900;
    }

    .check-item.done .check-box {
      border-color: rgba(216,183,106,0.62);
      background: rgba(216,183,106,0.24);
    }

    .game-box {
      margin-top: 20px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.45);
      padding: 16px;
    }

    .power-bar {
      position: relative;
      height: 34px;
      overflow: hidden;
      border-radius: 999px;
      border: 1px solid #CBEAFF;
      background: #EAF8FF;
    }

    .goal-zone {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 42%;
      width: 16%;
      background: rgba(191,232,216,0.86);
      box-shadow: 0 0 20px rgba(191,232,216,0.8);
    }

    .indicator {
      position: absolute;
      top: 4px;
      left: 2%;
      width: 12px;
      height: 26px;
      border-radius: 999px;
      background: var(--gold);
      box-shadow: 0 0 18px rgba(216,183,106,0.72);
      animation: powerMove 1.15s ease-in-out infinite;
    }

    .indicator.stop {
      opacity: 0.4;
      animation-play-state: paused;
    }

    @keyframes powerMove {
      0% {
        left: 2%;
      }
      50% {
        left: calc(98% - 12px);
      }
      100% {
        left: 2%;
      }
    }

    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 15px;
    }

    .score-row strong {
      font-size: 15px;
      color: var(--text);
    }

    .game-message {
      min-height: 66px;
      margin-top: 14px;
      border-radius: 20px;
      background: rgba(255,255,255,0.45);
      padding: 13px 14px;
      color: #42697C;
      font-size: 14px;
      line-height: 1.65;
    }

    .two-buttons {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      margin-top: 14px;
    }

    .final-name {
      margin-top: 14px;
      text-align: center;
      font-size: clamp(34px, 9vw, 42px);
      line-height: 1.08;
      color: #B99A49;
      animation: revealName 0.95s ease both;
    }

    @keyframes revealName {
      from {
        opacity: 0;
        transform: translateY(14px);
        filter: blur(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .final-actions {
      margin-top: 20px;
      display: grid;
      gap: 11px;
    }

    .fafaagram-wrap {
      margin-top: 24px;
      display: grid;
      place-items: center;
    }

    .fafaagram-card {
      position: relative;
      width: min(100%, 312px);
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 32px;
      border: 1px solid rgba(216,183,106,0.48);
      background: linear-gradient(135deg, #DDF3FF, #EAF8FF 52%, #F7FCFF);
      color: var(--text);
      padding: 20px;
      box-shadow: 0 24px 70px rgba(120,190,230,0.24);
    }

    .fafaagram-card.exporting,
    .fafaagram-card.exporting * {
      box-shadow: none !important;
    }

    .fafaagram-card .pattern-card {
      position: absolute;
      inset: 0;
      opacity: 0.34;
      background-image:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.72) 0 2px, transparent 2px),
        radial-gradient(circle at 80% 30%, rgba(216,183,106,0.22) 0 1.5px, transparent 1.5px),
        linear-gradient(135deg, rgba(255,255,255,0.16) 25%, transparent 25%),
        linear-gradient(225deg, rgba(255,255,255,0.14) 25%, transparent 25%);
      background-size: 36px 36px, 44px 44px, 60px 60px, 60px 60px;
    }

    .card-orb-a {
      position: absolute;
      top: 45px;
      right: -50px;
      width: 142px;
      height: 142px;
      border-radius: 999px;
      background: rgba(255,242,184,0.58);
      filter: blur(24px);
    }

    .card-orb-b {
      position: absolute;
      bottom: 44px;
      left: -60px;
      width: 160px;
      height: 160px;
      border-radius: 999px;
      background: rgba(203,234,255,0.75);
      filter: blur(24px);
    }

    .fafaagram-inner {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .fafaagram-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .fafaagram-title {
      font-size: 21px;
      color: var(--text);
    }

    .story-badge {
      border-radius: 999px;
      border: 1px solid rgba(216,183,106,0.35);
      background: rgba(255,255,255,0.45);
      padding: 8px 11px;
      color: var(--soft);
      font-size: 11px;
    }

    .fafaagram-center {
      margin: auto 0;
      text-align: center;
    }

    .card-icon {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 22px;
      border: 1px solid rgba(216,183,106,0.35);
      background: rgba(255,255,255,0.48);
    }

    .tiny-upper {
      text-transform: uppercase;
      letter-spacing: 0.28em;
      color: var(--soft);
      font-size: 11px;
    }

    .card-name {
      margin-top: 10px;
      font-size: 32px;
      line-height: 1.08;
      color: #B99A49;
    }

    .card-date {
      margin-top: 10px;
      color: #42697C;
      font-size: 14px;
      font-weight: 750;
    }

    .card-prayer {
      margin-top: 26px;
      white-space: pre-line;
      font-size: 14px;
      line-height: 1.82;
      color: var(--text);
    }

    .card-footer {
      border-radius: 19px;
      border: 1px solid rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.45);
      padding: 12px;
      text-align: center;
      color: var(--soft);
      font-size: 12px;
    }

    .slider-nav {
      margin-top: 14px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,0.78);
      background: rgba(255,255,255,0.45);
      box-shadow: 0 16px 45px rgba(120,190,230,0.18);
      backdrop-filter: blur(16px);
      padding: 12px;
    }

    .progress-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--soft);
      font-size: 12px;
      margin-bottom: 10px;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255,255,255,0.64);
      margin-bottom: 12px;
    }

    .progress-fill {
      height: 100%;
      width: 12.5%;
      border-radius: inherit;
      background: rgba(216,183,106,0.62);
      transition: width 0.32s ease;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 14px;
    }

    .clickable-gold {
      color: #B99A49;
      font-weight: 850;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 10000;
      width: min(92vw, 380px);
      transform: translateX(-50%);
      border-radius: 22px;
      border: 1px solid rgba(216,183,106,0.4);
      background: rgba(255,255,255,0.82);
      box-shadow: 0 18px 50px rgba(120,190,230,0.25);
      backdrop-filter: blur(18px);
      padding: 13px 16px;
      color: var(--text);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
      animation: toastIn 0.24s ease both;
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateX(-50%) translateY(16px) scale(0.96);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) translateY(0) scale(1);
      }
    }

    .hidden {
      display: none !important;
    }

    @media (min-width: 760px) {
      .app {
        padding: 26px;
      }

      .shell {
        min-height: calc(100vh - 52px);
      }
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <audio id="bgAudio" src="/audio/calm-islamic-lofi.mp3" loop preload="none"></audio>

  <script>
    const SHORT_NAME = "Fafaa";
    const SPECIAL_DATE = "18 Mei 2026";
    const SENDER = "Ruqoyyah";
    const USERNAME = "@rqyya_";

    const prayers = [
      "Semoga Allah tenangkan hatimu di hari-hari yang berat.",
      "Semoga langkahmu selalu diarahkan ke jalan yang baik.",
      "Semoga rezekimu bukan cuma banyak, tapi juga berkah.",
      "Semoga kamu dijauhkan dari hal yang melelahkan hati.",
      "Semoga Allah mudahkan urusan yang sedang kamu usahakan diam-diam.",
      "Semoga kamu makin dekat dengan Allah.",
      "Semoga hidupmu tidak cuma kuat, tapi juga bahagia."
    ];

    const checklistItems = [
      "Sudah bertahan hidup sampai umur ini",
      "Sudah pura-pura kuat padahal ngantuk",
      "Sudah pernah bilang “gapapa” padahal banyak apa-apanya",
      "Sudah istighfar belum hari ini?",
      "Sudah baca Qur’an belum hari ini?",
      "Sudah layak dapat doa baik",
      "Sudah resmi masuk fase: dewasa wkw"
    ];

    const state = {
      opened: getStorage("fafaa_opened", false),
      slide: getStorage("fafaa_current_slide", 0),
      audioOn: false,
      audioFailed: false,
      openedAt: getStorage("fafaa_opened_at", Date.now()),
      toastTimer: null,
      clockTimer: null
    };

    const pastelColors = [
      "#CBEAFF", "#DDF3FF", "#F8DDEB", "#FFF2B8",
      "#D9C9FF", "#CFF7E8", "#F7FCFF", "#D8B76A"
    ];

    function getStorage(key, fallback) {
      try {
        const item = localStorage.getItem(key);
        return item ? JSON.parse(item) : fallback;
      } catch {
        return fallback;
      }
    }

    function setStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function icon(name, size = 18) {
      const common = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"`;

      const icons = {
        sparkles: `<svg ${common}><path d="M9.9 2.8 8.6 8.6 2.8 9.9l5.8 1.3 1.3 5.8 1.3-5.8 5.8-1.3-5.8-1.3-1.3-5.8Z"/><path d="M19 14.5 18.3 17l-2.5.7 2.5.7.7 2.5.7-2.5 2.5-.7-2.5-.7-.7-2.5Z"/></svg>`,
        moon: `<svg ${common}><path d="M12 3a6.8 6.8 0 0 0 8.8 8.8A9 9 0 1 1 12 3Z"/><path d="M19 3v4"/><path d="M21 5h-4"/></svg>`,
        gift: `<svg ${common}><rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13"/><path d="M3 12h18"/><path d="M12 8H8.5A2.5 2.5 0 1 1 11 5.5c.7.8 1 2.5 1 2.5Z"/><path d="M12 8h3.5A2.5 2.5 0 1 0 13 5.5c-.7.8-1 2.5-1 2.5Z"/></svg>`,
        volumeOn: `<svg ${common}><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>`,
        volumeOff: `<svg ${common}><path d="M11 5 6 9H2v6h4l5 4V5Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>`,
        left: `<svg ${common}><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>`,
        right: `<svg ${common}><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>`,
        check: `<svg ${common}><path d="M20 6 9 17l-5-5"/></svg>`,
        trophy: `<svg ${common}><path d="M8 21h8"/><path d="M12 17v4"/><path d="M7 4h10v6a5 5 0 0 1-10 0V4Z"/><path d="M5 9a3 3 0 0 1-3-3V5h5"/><path d="M19 9a3 3 0 0 0 3-3V5h-5"/></svg>`,
        refresh: `<svg ${common}><path d="M3 12a9 9 0 0 1 15.1-6.6L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.1 6.6L3 16"/><path d="M3 21v-5h5"/></svg>`,
        share: `<svg ${common}><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4"/><path d="m15.4 6.5-6.8 4"/></svg>`,
        music: `<svg ${common}><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
        home: `<svg ${common}><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>`
      };

      return icons[name] || "";
    }

    function makeShape(path) {
      try {
        if (!window.confetti || !confetti.shapeFromPath) return "square";
        return confetti.shapeFromPath({
          path,
          matrix: [1, 0, 0, 1, -10, -10]
        });
      } catch {
        return "square";
      }
    }

    const diamondShape = makeShape("M10 0 L20 10 L10 20 L0 10 Z");
    const sparkleShape = makeShape("M10 0 L12.8 7.2 L20 10 L12.8 12.8 L10 20 L7.2 12.8 L0 10 L7.2 7.2 Z");

    function fireConfetti(type = "small") {
      if (!window.confetti) return;

      const base = {
        colors: pastelColors,
        disableForReducedMotion: true,
        zIndex: 9999
      };

      if (type === "small") {
        confetti({
          ...base,
          particleCount: 34,
          spread: 48,
          startVelocity: 20,
          scalar: 0.72,
          shapes: ["circle", "square", "star", diamondShape],
          origin: { y: 0.62 }
        });
        return;
      }

      if (type === "medium") {
        confetti({
          ...base,
          particleCount: 85,
          spread: 72,
          startVelocity: 28,
          scalar: 0.86,
          shapes: ["circle", "square", "star", diamondShape, sparkleShape],
          origin: { y: 0.55 }
        });
        return;
      }

      if (type === "big") {
        confetti({
          ...base,
          particleCount: 145,
          spread: 94,
          startVelocity: 35,
          scalar: 0.95,
          shapes: ["circle", "square", "star", diamondShape, sparkleShape],
          origin: { y: 0.55 }
        });

        confetti({
          ...base,
          particleCount: 70,
          angle: 60,
          spread: 65,
          origin: { x: 0, y: 0.68 },
          shapes: ["star", "circle", diamondShape]
        });

        confetti({
          ...base,
          particleCount: 70,
          angle: 120,
          spread: 65,
          origin: { x: 1, y: 0.68 },
          shapes: ["star", "circle", sparkleShape]
        });

        return;
      }

      if (type === "ending") {
        const end = Date.now() + 2300;

        function frame() {
          confetti({
            ...base,
            particleCount: 8,
            startVelocity: 18,
            ticks: 180,
            gravity: 0.55,
            scalar: 0.85,
            spread: 85,
            shapes: ["circle", "square", "star", diamondShape, sparkleShape],
            origin: { x: Math.random(), y: -0.08 }
          });

          if (Date.now() < end) requestAnimationFrame(frame);
        }

        frame();

        confetti({
          ...base,
          particleCount: 185,
          spread: 120,
          startVelocity: 42,
          scalar: 1,
          shapes: ["circle", "square", "star", diamondShape, sparkleShape],
          origin: { y: 0.55 }
        });
      }
    }

    function toast(text) {
      clearTimeout(state.toastTimer);
      const old = document.querySelector(".toast");
      if (old) old.remove();

      const el = document.createElement("div");
      el.className = "toast";
      el.textContent = text;
      document.body.appendChild(el);

      state.toastTimer = setTimeout(() => {
        el.remove();
      }, 2800);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function backgroundDecor() {
      const glitter = Array.from({ length: 18 }, (_, i) => {
        const left = Math.random() * 100;
        const delay = Math.random() * 6;
        const duration = 5 + Math.random() * 4;
        return `<span class="glitter" style="left:${left}%; animation-delay:${delay}s; animation-duration:${duration}s"></span>`;
      }).join("");

      return `
        <div class="pattern"></div>
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        ${glitter}
      `;
    }

    function render() {
      const app = document.getElementById("app");

      if (!state.opened) {
        app.innerHTML = `
          <main class="app">
            ${backgroundDecor()}
            <section class="shell">
              ${renderGate()}
            </section>
          </main>
        `;
      } else {
        app.innerHTML = `
          <main class="app">
            ${backgroundDecor()}
            <section class="shell slide-shell">
              ${renderHeader()}
              <div id="slideMount"></div>
              ${renderNavigation()}
            </section>
          </main>
        `;

        renderSlide();
        updateClock();
        startClock();
      }
    }

    function renderGate() {
      const answers = [
        SHORT_NAME,
        "Tukang parkir langit",
        "Admin grup yang sering hilang",
        "Orang yang katanya otw tapi ternyata baru mau mandi"
      ];

      return `
        <div class="gate-card glass">
          <div class="pill-row">
            <div class="pill">${icon("sparkles", 14)} private mission</div>
            <button class="pill gold-pill" data-date>${SPECIAL_DATE}</button>
          </div>

          <div class="icon-box">${icon("moon", 38)}</div>

          <h1 class="font-classy">Misi Rahasia 18 Mei</h1>

          <p class="lead">
            Sebelum lanjut, jawab dulu:<br>
            Hari ini ada manusia yang resmi bertambah masa uji cobanya. Siapa dia?
          </p>

          <div class="answer-list">
            ${answers.map(answer => `
              <button class="answer-btn" onclick="chooseAnswer('${escapeHtml(answer)}')">
                ${escapeHtml(answer)}
              </button>
            `).join("")}
          </div>

          <div id="gateMessage"></div>

          <p class="small-text" style="text-align:center; margin-top:18px;">
            Peringatan kecil: ada easter egg tersembunyi. Klik nama pendek atau tanggal beberapa kali kalau berani.
          </p>
        </div>
      `;
    }

    function chooseAnswer(answer) {
      const box = document.getElementById("gateMessage");

      if (answer !== SHORT_NAME) {
        box.innerHTML = `<div class="message-box">Salah. Coba istighfar dulu, lalu pilih yang benar.</div>`;
        return;
      }

      box.innerHTML = `<div class="message-box correct">wah pilihanmu benar</div>`;
      fireConfetti("big");
      setStorage("fafaa_opened", true);
      setStorage("fafaa_opened_at", Date.now());
      state.opened = true;
      state.openedAt = Date.now();

      setTimeout(() => {
        render();
        toast("Misi terbuka. Harap tetap kalem, walau agak kepo.");
      }, 950);
    }

    function renderHeader() {
      return `
        <header class="header">
          <div class="header-top">
            <button class="pill gold-pill" data-date>${SPECIAL_DATE}</button>
            <button class="audio-btn" onclick="toggleAudio()" id="audioBtn">
              ${icon("volumeOff", 16)}
              Audio OFF
            </button>
          </div>

          <div class="timer-grid">
            <div class="timer-cell" id="wibClock">WIB --:--:--</div>
            <div class="timer-cell" id="missionDuration">Durasi misi 00:00:00</div>
          </div>
        </header>
      `;
    }

    function startClock() {
      clearInterval(state.clockTimer);
      state.clockTimer = setInterval(updateClock, 1000);
    }

    function updateClock() {
      const clockEl = document.getElementById("wibClock");
      const durationEl = document.getElementById("missionDuration");
      if (!clockEl || !durationEl) return;

      const now = new Date();

      const wib = new Intl.DateTimeFormat("id-ID", {
        timeZone: "Asia/Jakarta",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).format(now);

      const seconds = Math.max(0, Math.floor((Date.now() - state.openedAt) / 1000));
      const hh = String(Math.floor(seconds / 3600)).padStart(2, "0");
      const mm = String(Math.floor((seconds % 3600) / 60)).padStart(2, "0");
      const ss = String(seconds % 60).padStart(2, "0");

      clockEl.textContent = `WIB ${wib}`;
      durationEl.textContent = `Durasi misi ${hh}:${mm}:${ss}`;
    }

    async function toggleAudio() {
      const audio = document.getElementById("bgAudio");
      const btn = document.getElementById("audioBtn");

      if (!audio || state.audioFailed) {
        toast("Audio belum tersedia, tapi misinya tetap jalan.");
        return;
      }

      try {
        if (state.audioOn) {
          audio.pause();
          state.audioOn = false;
          if (btn) btn.innerHTML = `${icon("volumeOff", 16)} Audio OFF`;
        } else {
          audio.volume = 0.38;
          await audio.play();
          state.audioOn = true;
          if (btn) btn.innerHTML = `${icon("volumeOn", 16)} Audio ON`;
        }
      } catch {
        state.audioFailed = true;
        state.audioOn = false;
        if (btn) btn.innerHTML = `${icon("volumeOff", 16)} Audio OFF`;
        toast("Audio belum tersedia, tapi misinya tetap jalan.");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const audio = document.getElementById("bgAudio");
      if (audio) {
        audio.addEventListener("error", () => {
          state.audioFailed = true;
          state.audioOn = false;
        });
      }
    });

    function slides() {
      return [
        slideOne,
        slideTwo,
        slideThree,
        slideFour,
        slideFive,
        slideSix,
        slideSeven,
        slideEight
      ];
    }

    function renderSlide() {
      const mount = document.getElementById("slideMount");
      if (!mount) return;

      const all = slides();
      state.slide = Math.min(Math.max(state.slide, 0), all.length - 1);
      setStorage("fafaa_current_slide", state.slide);

      mount.innerHTML = all[state.slide]();

      const current = document.getElementById("slideCurrent");
      const percent = document.getElementById("slidePercent");
      const fill = document.getElementById("progressFill");
      const prev = document.getElementById("prevBtn");
      const next = document.getElementById("nextBtn");

      if (current) current.textContent = `Slide ${state.slide + 1} / ${all.length}`;
      if (percent) percent.textContent = `${Math.round(((state.slide + 1) / all.length) * 100)}%`;
      if (fill) fill.style.width = `${((state.slide + 1) / all.length) * 100}%`;
      if (prev) prev.disabled = state.slide === 0;
      if (next) next.disabled = state.slide === all.length - 1;
    }

    function renderNavigation() {
      return `
        <div class="slider-nav">
          <div class="progress-info">
            <span id="slideCurrent">Slide 1 / 8</span>
            <span id="slidePercent">12%</span>
          </div>

          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>

          <div class="nav-grid">
            <button class="nav-btn" id="prevBtn" onclick="moveSlide(-1)">
              ${icon("left", 17)}
              Previous
            </button>
            <button class="nav-btn gold-btn" id="nextBtn" onclick="moveSlide(1)">
              Next
              ${icon("right", 17)}
            </button>
          </div>
        </div>
      `;
    }

    function moveSlide(direction) {
      const all = slides();
      const next = Math.min(Math.max(state.slide + direction, 0), all.length - 1);
      if (next === state.slide) return;

      state.slide = next;
      setStorage("fafaa_current_slide", state.slide);
      fireConfetti("small");
      renderSlide();
    }

    function badge(text) {
      return `<div class="badge">${icon("sparkles", 13)} ${text}</div>`;
    }

    function slideCard(title, inner, badgeText = "") {
      return `
        <article class="slide-card glass">
          <div class="content">
            ${badgeText ? badge(badgeText) : ""}
            <h2 class="font-classy">${title}</h2>
            <div style="margin-top:20px;">
              ${inner}
            </div>
          </div>
        </article>
      `;
    }

    function giftButton() {
      return `
        <button class="gift-btn" onclick="openGiftBox()">
          ${icon("gift", 18)}
          Buka bonus doa
        </button>
      `;
    }

    function slideOne() {
      return slideCard(
        "Pengumuman Tidak Terlalu Resmi",
        `
          <p class="text">
            Telah terjadi sesuatu pada 18 Mei 2026.
            <br>Seorang manusia bernama <span class="clickable-gold" data-fafaa>${SHORT_NAME}</span> mengalami penambahan umur secara tidak terhindarkan.
          </p>

          <div class="note-box">
            Mohon tetap tenang. Ini bukan drill.
          </div>

          ${giftButton()}
        `,
        "announcement mode"
      );
    }

    function slideTwo() {
      return slideCard(
        "Wih, Nambah Umur Nih",
        `
          <p class="text">
            Semoga bukan cuma angka yang naik, tapi juga iman, amal, rezeki, dan tingkat kesabaran.
          </p>

          <div class="note-box" style="background:rgba(255,248,229,0.56); color:var(--text); font-weight:750;">
            Status: masih dalam pengawasan malaikat pencatat amal.
          </div>

          ${giftButton()}
                  `,
        "level up detected"
      );
    }

    function slideThree() {
      return slideCard(
        "Doa Baik Hari Ini",
        `
          <p class="text">
            Semoga Allah jaga langkahmu, lembutkan hatimu, luaskan rezekimu, kuatkan imanmu, dan jadikan hidupmu makin berkah.
          </p>

          <p class="text">
            Semoga yang kamu usahakan diam-diam, Allah mudahkan dengan cara yang paling indah.
          </p>

          ${giftButton()}
        `,
        "doa kalem"
      );
    }

    function slideFour() {
      const stats = [
        ["Iman", "semoga terus naik"],
        ["Rezeki", "semoga makin berkah"],
        ["Sabar", "semoga makin kuat"],
        ["Arah hidup", "semoga makin dekat dengan Allah"]
      ];

      return slideCard(
        "Catatan Baik Buat Bertumbuh",
        `
          <p class="text">
            Bertambah umur berarti bertambah juga kesempatan buat memperbaiki diri.
            <br>Semoga langkahmu makin dekat dengan hal-hal baik, usahamu di dunia dimudahkan, tapi urusan akhirat tetap tidak ketinggalan.
          </p>

          <p class="text">
            Dunia boleh dikejar, tapi akhirat jangan sampai tertinggal.
            <br>Pelan-pelan saja, yang penting arahnya tetap menuju kebaikan.
          </p>

          <div class="stat-grid">
            ${stats.map(([label, value]) => `
              <div class="stat-card">
                <span>${label}</span>
                <strong>${value}</strong>
              </div>
            `).join("")}
          </div>

          ${giftButton()}
        `,
        "growth notes"
      );
    }

    function slideFive() {
      return slideCard(
        "pesan kecil",
        `
          <div class="warm-box">
            <p class="text">
              Maaf ya untuk segala hal yang pernah terjadi.
              <br>Maaf kalau pernah salah ngomong, salah sikap, bikin tidak nyaman, atau ada hal yang belum sempat dijelaskan dengan baik.
            </p>

            <p class="text">
              Semoga yang kurang baik bisa Allah lembutkan,
              <br>dan yang baik bisa tetap dijaga.
            </p>

            <p style="margin-top:22px; text-align:right; color:var(--soft); font-size:14px; font-weight:800;">
              by. ${USERNAME}
            </p>
          </div>
        `,
        "personal note"
      );
    }

    function getChecklist() {
      const saved = getStorage("fafaa_checklist", null);
      if (Array.isArray(saved) && saved.length === checklistItems.length) return saved;
      return Array(checklistItems.length).fill(false);
    }

    function slideSix() {
      const checklist = getChecklist();
      const allDone = checklist.every(Boolean);

      return slideCard(
        "Checklist Manusia Bertambah Umur",
        `
          <div class="check-list">
            ${checklistItems.map((item, index) => `
              <button class="check-item ${checklist[index] ? "done" : ""}" onclick="toggleChecklist(${index})">
                <span class="check-box">${checklist[index] ? "✓" : ""}</span>
                <span>${item}</span>
              </button>
            `).join("")}
          </div>

          ${allDone ? `
            <div class="note-box" style="background:rgba(255,248,229,0.56); color:var(--text); font-weight:750;">
              Checklist selesai. <span class="clickable-gold" data-fafaa>${SHORT_NAME}</span> dinyatakan layak menerima doa tambahan.
            </div>
          ` : ""}
        `,
        "interactive checklist"
      );
    }

    function toggleChecklist(index) {
      const checklist = getChecklist();
      checklist[index] = !checklist[index];
      setStorage("fafaa_checklist", checklist);

      if (checklist.every(Boolean)) {
        const already = getStorage("fafaa_checklist_done_once", false);
        if (!already) {
          setStorage("fafaa_checklist_done_once", true);
          fireConfetti("medium");
          toast("Checklist selesai. Fafaa dinyatakan layak menerima doa tambahan.");
        }
      }

      renderSlide();
    }

    function getGame() {
      return {
        shots: getStorage("fafaa_game_shots", 0),
        goals: getStorage("fafaa_game_goals", 0),
        message: getStorage("fafaa_game_message", "Bidik zona hijau di tengah. Jangan tegang, ini bukan final piala dunia.")
      };
    }

    function setGame(game) {
      setStorage("fafaa_game_shots", game.shots);
      setStorage("fafaa_game_goals", game.goals);
      setStorage("fafaa_game_message", game.message);
    }

    function slideSeven() {
      const game = getGame();
      const finished = game.shots >= 5;

      return slideCard(
        "Penalty Bar Challenge",
        `
          <p class="text">
            Klik Shoot saat indikator masuk zona hijau. Kamu punya 5 kesempatan.
          </p>

          <div class="game-box">
            <div class="power-bar" id="powerBar">
              <div class="goal-zone"></div>
              <div class="indicator ${finished ? "stop" : ""}" id="indicator"></div>
            </div>

            <div class="score-row">
              <strong>Gol: ${game.goals} / 5</strong>
              <span class="small-text">Kesempatan: ${Math.max(0, 5 - game.shots)}</span>
            </div>

            <div class="game-message">
              ${game.message}
            </div>

            <div class="two-buttons">
              <button class="btn gold-btn" onclick="shootPenalty()" ${finished ? "disabled" : ""}>Shoot</button>
              <button class="btn" onclick="resetGame()">Ulang</button>
            </div>
          </div>
        `,
        "mini game"
      );
    }

    function shootPenalty() {
      const game = getGame();
      if (game.shots >= 5) return;

      const bar = document.getElementById("powerBar");
      const indicator = document.getElementById("indicator");
      if (!bar || !indicator) return;

      const parent = bar.getBoundingClientRect();
      const rect = indicator.getBoundingClientRect();
      const center = rect.left + rect.width / 2 - parent.left;
      const ratio = center / parent.width;
      const isGoal = ratio >= 0.42 && ratio <= 0.58;

      game.shots += 1;

      if (isGoal) {
        game.goals += 1;
        game.message = "Gol! Rezeki, iman, dan semangat naik +10.";
        fireConfetti("small");
      } else {
        game.message = "Melenceng dikit. Tidak apa-apa, yang penting bukan arah hidupnya.";
      }

      if (game.shots >= 5) {
        if (game.goals >= 3) {
          game.message = "Lulus. Masih ada harapan besar untuk menjadi makin baik, makin kuat, dan makin dekat dengan Allah.";
          fireConfetti("big");
        } else {
          game.message = "Tidak apa-apa. Latihan lagi. Bahkan menjadi dewasa juga butuh proses.";
        }
      }

      setGame(game);
      renderSlide();
    }

    function resetGame() {
      setGame({
        shots: 0,
        goals: 0,
        message: "Bidik zona hijau di tengah. Jangan tegang, ini bukan final piala dunia."
      });
      renderSlide();
    }

    function slideEight() {
      return slideCard(
        "Untuk",
        `
          <div style="text-align:center;">
            <h3 class="font-classy final-name">Ahmad Fawaid Ridwan</h3>

            <p style="margin-top:9px; color:var(--soft); font-size:14px; font-weight:800;" data-date>
              ${SPECIAL_DATE}
            </p>

            <p class="text" style="margin-top:22px;">
              Semoga Allah selalu jaga dalam kebaikan,
              <br>memudahkan langkahmu,
              <br>melapangkan hatimu,
              <br>dan menjadikan umurmu penuh berkah.
            </p>

            <p style="margin-top:18px; color:var(--text); font-size:14px; font-weight:850;">
              Ditulis oleh: ${SENDER}
            </p>

            <p class="small-text" style="margin-top:14px;">
              By Xia Fuya.
            </p>
          </div>

          <div class="fafaagram-wrap">
            ${fafaagramCard()}
          </div>

          <div class="final-actions">
            <button class="btn gold-btn" onclick="fireConfetti('ending')">
              ${icon("sparkles", 17)}
              Buka Confetti Terakhir
            </button>

            <button class="btn" onclick="restartMission()">
              ${icon("refresh", 17)}
              Ulangi dari Awal
            </button>

            <button class="btn gold-btn" onclick="downloadFafaagram()">
              ${icon("trophy", 17)}
              Download Fafaagram Card
            </button>

            <button class="btn" onclick="shareFafaagram()">
              ${icon("share", 17)}
              Share Fafaagram Card
            </button>
          </div>
        `,
        "final reveal"
      );
    }

    function fafaagramCard() {
      return `
        <div class="fafaagram-card" id="fafaagramCard">
          <div class="pattern-card"></div>
          <div class="card-orb-a"></div>
          <div class="card-orb-b"></div>

          <div class="fafaagram-inner">
            <div class="fafaagram-top">
              <div>
                <p class="font-classy fafaagram-title">Fafaagram</p>
                <p class="small-text">${USERNAME}</p>
              </div>
              <div class="story-badge">story</div>
            </div>

            <div class="fafaagram-center">
              <div class="card-icon">${icon("moon", 30)}</div>
              <p class="tiny-upper">untuk</p>
              <h3 class="font-classy card-name">Ahmad Fawaid Ridwan</h3>
              <p class="card-date">${SPECIAL_DATE}</p>

              <p class="card-prayer">
                Semoga Allah selalu jaga dalam kebaikan,
                <br>memudahkan langkahmu,
                <br>melapangkan hatimu,
                <br>dan menjadikan umurmu penuh berkah.
              </p>
            </div>

            <div class="card-footer">
              Ditulis oleh: ${SENDER}
            </div>
          </div>
        </div>
      `;
    }

    async function downloadFafaagram() {
      const card = document.getElementById("fafaagramCard");
      if (!card || !window.htmlToImage) {
        toast("Download belum siap. Coba buka lewat browser terbaru.");
        return;
      }

      try {
        card.classList.add("exporting");

        const dataUrl = await htmlToImage.toPng(card, {
          pixelRatio: 3,
          cacheBust: true,
          backgroundColor: "#DDF3FF"
        });

        const link = document.createElement("a");
        link.href = dataUrl;
        link.download = "fafaagram-card.png";
        link.click();

        toast("Fafaagram Card berhasil di-download.");
      } catch {
        toast("Download belum berhasil. Coba lagi sebentar.");
      } finally {
        card.classList.remove("exporting");
      }
    }

    async function shareFafaagram() {
      const shareText =
        `Fafaagram\n${SPECIAL_DATE}\n\nSemoga Allah selalu jaga dalam kebaikan, memudahkan langkahmu, melapangkan hatimu, dan menjadikan umurmu penuh berkah.\n\nDitulis oleh: ${SENDER}`;

      try {
        const card = document.getElementById("fafaagramCard");

        if (card && window.htmlToImage && navigator.share && navigator.canShare) {
          const blob = await htmlToImage.toBlob(card, {
            pixelRatio: 3,
            cacheBust: true,
            backgroundColor: "#DDF3FF"
          });

          if (blob) {
            const file = new File([blob], "fafaagram-card.png", { type: "image/png" });

            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                title: "Fafaagram",
                text: shareText,
                files: [file]
              });
              return;
            }
          }
        }

        await navigator.clipboard.writeText(shareText);
        toast("Teks Fafaagram berhasil disalin.");
      } catch {
        try {
          await navigator.clipboard.writeText(shareText);
          toast("Teks Fafaagram berhasil disalin.");
        } catch {
          toast("Share belum tersedia di perangkat ini.");
        }
      }
    }

    function restartMission() {
      setStorage("fafaa_current_slide", 0);
      setStorage("fafaa_opened", false);
      setStorage("fafaa_opened_at", Date.now());
      state.slide = 0;
      state.opened = false;
      state.openedAt = Date.now();
      render();
      toast("Misi diulang dari awal.");
    }

    function openGiftBox() {
      const prayer = prayers[Math.floor(Math.random() * prayers.length)];
      fireConfetti("medium");

      const modal = document.createElement("div");
      modal.className = "modal-backdrop";
      modal.innerHTML = `
        <div class="modal-card" onclick="event.stopPropagation()">
          <div class="icon-box" style="width:58px; height:58px; border-radius:20px; margin-bottom:16px;">
            ${icon("moon", 26)}
          </div>

          <h3 class="font-classy" style="font-size:28px; color:var(--text);">Bonus Doa</h3>

          <p class="text" style="margin-top:12px; text-align:center;">
            ${escapeHtml(prayer)}
          </p>

          <p class="small-text" style="margin-top:18px;">by. ${USERNAME}</p>

          <button class="btn gold-btn" style="margin-top:18px; min-width:120px;" onclick="closeGiftBox()">
            Aamiin
          </button>
        </div>
      `;

      modal.addEventListener("click", closeGiftBox);
      document.body.appendChild(modal);
    }

    function closeGiftBox() {
      const modal = document.querySelector(".modal-backdrop");
      if (modal) modal.remove();
    }

    document.addEventListener("click", (event) => {
      const fafaa = event.target.closest("[data-fafaa]");
      const date = event.target.closest("[data-date]");

      if (fafaa) {
        const count = getStorage("fafaa_easter_name", 0) + 1;
        setStorage("fafaa_easter_name", count);

        if (count === 5) {
          fireConfetti("small");
          toast("Hello fafaa.");
        }
      }

      if (date) {
        const count = getStorage("fafaa_easter_date", 0) + 1;
        setStorage("fafaa_easter_date", count);

        if (count === 3) {
          toast("Catatan rahasia terbuka: semoga hari ini jadi salah satu hari yang kamu kenang dengan baik.");
        }
      }
    });

    window.addEventListener("load", () => {
      if (!getStorage("fafaa_opened_at", null)) {
        setStorage("fafaa_opened_at", Date.now());
        state.openedAt = Date.now();
      }

      render();
    });
  </script>
</body>
</html>
